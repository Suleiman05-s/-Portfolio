<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Suleiman Obeidat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>

    <main>
        <section class="form-section">
            <h2>Contact Form</h2>
            <form id="contactForm">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">

                <label for="country">Country:</label>
                <select id="country" name="country">
                    <option value="">-- Select Country --</option>
                    <option value="Jordan">Jordan</option>
                    <option value="Palestine">Palestine</option>
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="UAE">UAE</option>
                    <option value="Other">Other</option>
                </select>

                <label for="comments">Comments / Message:</label>
                <textarea id="comments" name="comments" rows="5" placeholder="Write your message here..."></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Suleiman Obeidat. All Rights Reserved.</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const country = document.getElementById('country').value;
            const comments = document.getElementById('comments').value.trim();

            if (!fullName || !email || !country || !comments) {
                alert('Please fill out all required fields before submitting.');
            } else {
                alert('Thank you, ' + fullName + '! Your message has been sent successfully.');
                this.reset();
            }
        });
    </script>

</body>
</html>
